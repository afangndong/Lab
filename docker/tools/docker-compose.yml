services:
  jenkins:
    build: ./jenkins
    container_name: lab-jenkins
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - lab_backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/repo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  jenkins_home:
  lab_backups:
    name: lab_backups