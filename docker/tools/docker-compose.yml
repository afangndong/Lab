services:
  jenkins:
    build: ./jenkins
    container_name: lab-jenkins
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - lab_backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/repo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redmine:
    image: redmine:6
    container_name: lab-redmine
    ports:
      - "3000:3000"
    volumes:
      - redmine_files:/usr/src/redmine/files 
      - redmine_db:/usr/src/redmine/sqlite
      

volumes:
  jenkins_home:
  lab_backups:
    name: lab_backups
  redmine_files:
  redmine_db: