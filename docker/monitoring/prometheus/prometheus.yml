global:
  scrape_interval: 30s
  scrape_timeout: 20s       # der Exporter pingt bei Ausfall mit je 1 s Wartezeit

scrape_configs:
  - job_name: net-lab
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]