---
- name: FRR-Konfiguration auf die Router
  hosts: routers
  gather_facts: false
  tasks:
    - name: Ordner für die gerenderte Konfiguration
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../build/{{ inventory_hostname }}"
        state: directory
        mode: "0755"

    - name: Konfiguration aus der Vorlage rendern
      ansible.builtin.template:
        src: frr.conf.j2
        dest: "{{ playbook_dir }}/../build/{{ inventory_hostname }}/frr.conf"
        mode: "0644"
      register: frr_conf

    - name: Laufende Konfiguration lesen
      ansible.builtin.command: docker exec {{ container }} vtysh -c "show running-config"
      register: running
      changed_when: false
      check_mode: false

    - name: Konfiguration in den Container kopieren
      ansible.builtin.command: >
        docker cp {{ playbook_dir }}/../build/{{ inventory_hostname }}/frr.conf
        {{ container }}:/etc/frr/frr.conf
      when: frr_conf.changed or 'router ospf' not in running.stdout

    - name: Konfiguration laden
      ansible.builtin.command: docker exec {{ container }} vtysh -f /etc/frr/frr.conf
      when: frr_conf.changed or 'router ospf' not in running.stdout

- name: Standardweg der Hosts über den Filial-Router
  hosts: clients:servers
  gather_facts: false
  tasks:
    - name: Aktuellen Standardweg lesen
      ansible.builtin.command: docker exec {{ container }} ip route show default
      register: route
      changed_when: false
      check_mode: false

    - name: Standardweg setzen
      ansible.builtin.command: docker exec {{ container }} ip route replace default via {{ lan_gateway }}
      when: lan_gateway not in route.stdout