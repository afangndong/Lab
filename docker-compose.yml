  pc01:
    image: ${CLIENT_IMAGE:-nicolaka/netshoot:latest}
    command:
      - tail
      - -f
      - /dev/null
    container_name: lab-pc01
    hostname: pc01
    cap_add:
      - NET_ADMIN
    networks:
      lan1:
        ipv4_address: 10.10.1.10
  pc02:
    image: ${CLIENT_IMAGE:-nicolaka/netshoot:latest}
