# GENERIERT aus data/sites.yml durch scripts/generate.py. Nicht von Hand aendern.
services:
  core1:
    image: ${FRR_IMAGE:-frrouting/frr:v8.4.1}
    container_name: lab-core1
    hostname: core1
    privileged: true
    sysctls:
      net.ipv4.ip_forward: '1'
    ulimits:
      nofile:
        soft: 1024
        hard: 65536
    volumes:
      - ./docker/frr/daemons:/etc/frr/daemons:ro
    networks:
      bb1:
        ipv4_address: 10.0.1.1
      bb2:
        ipv4_address: 10.0.2.1
      bb3:
        ipv4_address: 10.0.3.1
      bb4:
        ipv4_address: 10.0.4.1
  br01:
    image: ${FRR_IMAGE:-frrouting/frr:v8.4.1}
    container_name: lab-br01
    hostname: br01
    privileged: true
    sysctls:
      net.ipv4.ip_forward: '1'
    ulimits:
      nofile:
        soft: 1024
        hard: 65536
    volumes:
      - ./docker/frr/daemons:/etc/frr/daemons:ro
    networks:
      bb1:
        ipv4_address: 10.0.1.2
      lan1:
        ipv4_address: 10.10.1.254
  br02:
